name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/release/br1_player.exe" "package/BR1 Player.exe"
          Copy-Item README.md, LICENSE package
          Compress-Archive -Path "package/*" -DestinationPath "BR1-Player-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BR1-Player-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
