[package]
name = "br1_player"
version = "0.4.0"
edition = "2021"
rust-version = "1.99"
description = "BR1 Player - desktop music player with playlist downloads"
license = "MIT"

[dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = "0.37.0"
egui-wgpu = "0.37.0"
wgpu = "30.0"
winit = "0.30"
pollster = "1.0"
liquid-rust = "0.2.5"
rodio = "0.22.2"
sofar = "0.4.0"
lofty = "0.22.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rfd = "0.15.4"
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
