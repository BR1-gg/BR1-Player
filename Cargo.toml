[package]
name = "def_player"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Simple desktop music player"

[dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = "0.37.0"
egui-wgpu = "0.37.0"
wgpu = "30.0"
winit = "0.30"
pollster = "1.0"
liquid-rust = "0.2.5"
rodio = "0.22.2"
lofty = "0.22.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rfd = "0.15.4"

[profile.release]
opt-level = 2
